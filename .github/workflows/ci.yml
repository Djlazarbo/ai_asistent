name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare local config for imports
        run: |
          cp config.example.yaml config.yaml
          cp .env.example .env

      - name: Run unit tests (merge gate)
        env:
          DEEPSEEK_API_KEY: dummy-for-ci
          APP_ENV: stage
        run: |
          pytest -v -m "not integration and not slow" --tb=short

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    # Does not block merge if flaky infra; reports separately.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobhunter
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: ci_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare config
        run: |
          cp config.example.yaml config.yaml
          cp .env.example .env
          sed -i 's/your_password_here/ci_secret/' .env
          sed -i 's/^POSTGRES_PORT=.*/POSTGRES_PORT=5433/' .env

      - name: Init schema + run integration tests
        env:
          DEEPSEEK_API_KEY: dummy-for-ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_DB: jobhunter
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: ci_secret
          APP_ENV: stage
        run: |
          # Apply app schema via init_db
          python -c "import asyncio, db_postgres as db; asyncio.run(db.init_db())"
          pytest -v -m integration --tb=short test_db_postgres.py
