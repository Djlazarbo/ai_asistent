name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_PATH:-/opt/job-hunter}"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "App not bootstrapped at $APP_DIR — run scripts/server_bootstrap.sh once"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
